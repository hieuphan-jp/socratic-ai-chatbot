# .github/workflows/ci.yml
#
# JA: CI。PR とプッシュで backend / frontend を独立に検査する。
#     - backend:  ruff（lint + format）と「マイグレーション漏れ」チェック
#     - frontend: 型チェック(tsc) と ビルド(vite build)
#     この最低ラインを緑にしてからマージする、が全員の共通ルール（CONVENTIONS.md 参照）。
# VI: CI. Kiểm tra backend / frontend độc lập khi PR và push.
#     - backend:  ruff (lint + format) và kiểm tra "thiếu migration"
#     - frontend: kiểm kiểu (tsc) và build (vite build)
#     Phải xanh mức tối thiểu này rồi mới merge, là quy tắc chung (xem CONVENTIONS.md).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements/local.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      # JA: モデルを変えたのに makemigrations し忘れると本番で壊れる。--check で検出。
      # VI: Đổi model mà quên makemigrations sẽ hỏng ở prod. Dùng --check để phát hiện.
      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
